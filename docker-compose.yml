services:
  mysql:
    image: mysql:8.4.4
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    volumes: [mysql_data:/var/lib/mysql]
    healthcheck:
      test: [CMD-SHELL, "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]
  redis:
    image: redis:7.4.2-alpine
    command: redis-server --appendonly yes
    volumes: [redis_data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]
  web:
    build: ./backend
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    env_file: .env
    volumes: [./backend:/app, ./reports:/app/reports, ./private_uploads:/app/private_uploads]
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: on-failure:5
    ports: ["8000:8000"]
    networks: [internal]
  celery_worker:
    build: ./backend
    command: celery -A config worker -l INFO -Q http,report -c 1
    env_file: .env
    volumes: [./backend:/app, ./reports:/app/reports]
    depends_on: [web]
    networks: [internal]
  celery_beat:
    build: ./backend
    command: celery -A config beat -l INFO
    env_file: .env
    volumes: [./backend:/app]
    depends_on: [web]
    networks: [internal]
  frontend:
    image: node:22.14.0-alpine
    working_dir: /app
    command: sh -c "corepack enable && pnpm install --frozen-lockfile=false && pnpm dev --host 0.0.0.0"
    volumes: [./frontend:/app, frontend_node_modules:/app/node_modules]
    ports: ["5173:5173"]
    networks: [internal]
  nginx:
    image: nginx:1.27.4-alpine
    profiles: [nginx]
    depends_on: [web, frontend]
    ports: ["8080:80"]
    volumes: [./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro]
    networks: [internal]
volumes:
  mysql_data:
  redis_data:
  frontend_node_modules:
networks:
  internal:
    internal: false
